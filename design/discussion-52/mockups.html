function icon(n){return '<svg aria-hidden="true" viewBox="0 0 24 24">'+(icons[n]||icons.thread)+'</svg>'}
function ib(n,label){return '<button class="ico" aria-label="'+label+'" title="'+label+'">'+icon(n)+'</button>'}
function av(n,tiny=false){if(n==='workspace'||n==='edu')return '<span class="avatar initial '+(tiny?'tiny':'')+'">'+(n==='workspace'?'P':'E')+'</span>'; return '<img class="avatar '+(tiny?'tiny':'')+'" alt="" src="'+n+'.png">'}
function nav(n,label,selected=false,extra=''){return '<button class="nav '+(selected?'selected':'')+'">'+icon(n)+'<span>'+label+'</span>'+extra+'</button>'}
function sidebar(){return '<nav class="sidebar" aria-label="Workspace"><button class="workspace">'+av('workspace')+'<span class="grow">Personal</span>'+icon('caret')+'</button>'+'<button class="nav"><img class="avatar tiny" src="tucano.png" alt="">Tuca</button>'+nav('ask','Asks',false,'<span class="count">1</span>')+nav('shield','Approvals')+nav('book','Memory')+nav('layers','Wiki')+nav('clock','Routines')+nav('layers','Skills')+nav('report','Report')+'<div class="caps">Channels</div>'+nav('hash','checkout',true)+nav('hash','incidents')+nav('hash','general')+nav('hash','design')+'<div class="caps">Direct messages</div><button class="nav">'+av('leo',true)+'Leo <span class="count">Engineering</span></button><button class="nav">'+av('nico',true)+'Nico <span class="count">Review</span></button><div class="bottom">'+nav('report','Usage and limits')+nav('plug','Connectors')+nav('gear','Settings')+'</div></nav>'}
function head(extra=''){return '<header class="head">'+ib('back','Back to channel')+'<strong># checkout</strong><span class="sep desktop-only"></span><span class="desc">Online store · payments and cart</span><span class="grow"></span>'+extra+'</header>'}

function msg(who,time,content,step=''){return '<article class="msg">'+av(who.toLowerCase())+'<div class="body"><div class="meta"><strong>'+who+'</strong><span class="time">'+time+'</span></div>'+(step?'<div class="step">'+icon('chevron')+step+'</div>':'')+content+'</div></article>'}
function threadContent(){return '<div class="reading"><div class="root"><div class="row small muted" style="margin-bottom:12px">'+icon('thread')+'Started by Edu · today at 09:10</div><p><strong>Fix the payment timeout without retrying a charge twice.</strong></p><p class="muted">Check the retry path, add coverage and ask Nico to review before merging.</p></div>'+msg('Leo','09:13','<p>The timeout is now <strong>10 seconds</strong>. Retries reuse the same idempotency key, so the second request cannot charge the customer twice.</p><div class="code">await charge({ timeout: 10_000,<br>  idempotencyKey: payment.id });</div><p>All <strong>52 tests pass</strong>. <a href="#">Nico, review the retry path?</a></p>','5 steps · 21s')+msg('Nico','09:14','<div class="quote"><strong>Leo</strong><div class="muted">Retries reuse the same idempotency key.</div></div><p>I’m checking the failed-retry case and whether the key survives a second request.</p>','Reviewing · 12s')+'</div>'}

function context(){return '<div class="app">'+sidebar()+'<main class="main">'+head(ib('x','Close channel context'))+'<div class="sheetbody"><aside class="sheetnav"><div class="caps" style="padding:0 10px 12px">Channel context</div>'+nav('book','Brief & memory',true)+nav('plug','Agent access')+nav('users','Members')+'<div class="small muted" style="padding:20px 10px">Facts here belong to #checkout.<br>Agent rules stay with each agent.</div></aside><div style="display:flex;flex-direction:column;min-height:0"><div class="sheetcontent"><div class="title2">Context for #checkout</div><p class="muted">Give reusable agents the project facts they need here.</p><section class="section"><div class="sectiontitle">Channel brief</div><p class="small muted">Included in this channel’s threads. Edits apply to future replies.</p><div class="field">Online store · payments and cart.<br>Use the staging environment for testing. Ask for approval before publishing a release.</div></section><section class="section"><div class="row"><div class="sectiontitle grow">Memory for this channel</div><button class="btn">'+icon('plus')+'Add fact</button></div><div class="entry"><div class="row"><span class="grow">Refund copy needs support review before release.</span><span class="tag">#checkout</span></div><div class="small muted">From “Review the refund copy” · View source</div></div><div class="entry"><div class="row"><span class="grow">Retries must reuse the payment’s idempotency key.</span><span class="tag">#checkout</span></div><div class="small muted">From “Fix the payment timeout” · View source</div></div><p class="small muted" style="margin-top:10px">A project fact stays here. Sharing it with the workspace is an explicit action.</p></section><section class="section"><div class="sectiontitle">Agent access · current permissions</div><p class="small muted">Channel context does not restrict tools or files.</p><table class="permissiontable"><thead><tr><th>Agent</th><th>GitHub</th><th>Computer</th><th></th></tr></thead><tbody><tr><td><div class="row">'+av('leo',true)+'Leo</div></td><td>Read and write</td><td>This computer</td><td><a href="#">Manage agent</a></td></tr><tr><td><div class="row">'+av('nico',true)+'Nico</div></td><td>Read only</td><td>None</td><td><a href="#">Manage agent</a></td></tr></tbody></table></section><div class="notice"><strong>On this Windows computer</strong><br>Agents using “This computer” can access files as your user. This channel brief does not impose a folder limit.</div></div><footer class="footbar"><span class="small muted grow">Proposed settings · illustrative data</span><button class="btn">Cancel</button><button class="btn primary">Save brief</button></footer></div></div></main></div>'}
function replies(){return '<main class="actionscene"><div class="row">'+icon('hash')+'<strong>checkout</strong><span class="grow"></span><span class="small muted">Shared proposal · Reply intent</span></div><div class="actioncolumns"><section><div class="sectiontitle">Choose where the response goes.</div><p class="muted">Keep quick quotes and separate tasks distinct.</p>'+msg('Leo','09:13','<p>The timeout is now 10 seconds.<br><span style="background:var(--soft)">Retries reuse the same idempotency key.</span></p>')+'<div class="actionmenu"><button>'+icon('thread')+'<div><strong>Quote in channel</strong><span class="small muted">Reply here with the selected excerpt</span></div></button><button>'+icon('plus')+'<div><strong>Start thread</strong><span class="small muted">A separate conversation from this message</span></div></button></div><div class="slash"><code>/thread Check the retry path</code><p class="small muted" style="margin-top:8px">Creates a new thread from this prompt.<br>Nothing is sent until you press Send.</p></div></section><section><div class="sectiontitle">Quote preview in the composer</div><p class="muted">Name the destination beside the quoted source.</p>'+composer('Message #checkout…',false,'Retries reuse the same idempotency key.')+'<div class="notice"><strong>Work in threads · proposed channel setting</strong><br>New prompts sent to this channel start threads. The composer says “Start a thread in #checkout”. Quoting remains an explicit channel reply.</div><div class="annotation"><strong>No silent change of destination.</strong><p class="muted" style="margin-top:6px">Opening a thread, quoting, and sending a new task each show where the message will land.</p></div><p class="small muted">Design proposal · Examples based on #32 and #39.<br>“Reply in thread” opens the existing thread when one already exists.</p></section></div></main>'}
