# The Windows installer: a per-user NSIS .exe for x64, built on Windows and not
# code-signed (install.ps1 installs it without a SmartScreen warning). The Mac build
# creates the release (scripts/release.sh); once it's published, this attaches the
# installer, its blockmap and the update feed (latest.yml) to the same release. A pull
# request that touches the packaging builds it too, without publishing anything.
name: Windows

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Windows files to (e.g. v0.2.0); empty for a test build, kept as an artifact
        required: false
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - build/**
      - install.ps1
      - .github/workflows/windows.yml

permissions:
  contents: write

jobs:
  build:
    name: x64
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/whisper.mjs win x64 # dictation's whisper-cli, packed in the app
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never --config.directories.output=dist-win
      - run: ls -la dist-win && cat dist-win/latest.yml
      # Installs it the way people will, and checks the app is really there. Not through
      # install.ps1: that script is upstream and looks for a Tucano.exe in the installed apps,
      # while this fork packages as tucanonext-setup-<version>.exe and installs TucanoNext.exe
      # (package.json, build.nsis and productName).
      - name: Install it and check the app is there
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist-win/*.exe | Select-Object -First 1).Path
          Write-Host "Installing $setup"
          $p = Start-Process -FilePath $setup -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer stopped with $($p.ExitCode)" }
          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          $app = Get-ChildItem $programs -Recurse -Filter "Tucano*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "Uninstall*" } | Select-Object -First 1
          if (-not $app) { throw "the installer finished but left no Tucano exe in your Programs folder" }
          Write-Host "Installed in $($app.FullName)"
      - name: The version is the release's
        if: env.TAG != ''
        # The fork tags next-v0.2.42; upstream tags v0.2.42. Both name the same version.
        run: test "v$(node -p "require('./package.json').version")" = "${TAG#next-}"
      - name: Attach to the release
        if: env.TAG != ''
        run: gh release upload "$TAG" dist-win/*.exe dist-win/*.exe.blockmap dist-win/latest.yml --clobber
      - name: Keep the files of a test build
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: tucano-win-x64
          path: |
            dist-win/*.exe
            dist-win/*.exe.blockmap
            dist-win/latest.yml
          retention-days: 3
